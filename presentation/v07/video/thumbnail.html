<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
  /* 1280×720 YouTube thumbnail — same palette as the deck. ?v=b for the second option. */
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { background: #edf0f2; color: #15202e; font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  .wrap { position: absolute; inset: 0; padding: 64px 72px 104px; /* bottom room: YouTube draws the duration badge there */ display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
  .eyebrow { font: 600 26px/1 "IBM Plex Mono", monospace; letter-spacing: .12em; color: #2a58a3; text-transform: uppercase; }
  h1 { margin: 0; font-weight: 700; font-size: 104px; line-height: 1.12; letter-spacing: -0.03em; }
  mark { color: inherit; background: linear-gradient(#f5d352, #f5d352) no-repeat 0 86% / 100% 58%; padding: 0 .08em; }
  .strike { color: #7b8794; text-decoration: line-through; text-decoration-thickness: 6px; text-decoration-color: #c0392b; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .claim { font-weight: 700; font-size: 44px; line-height: 1.2; }
  .claim small { display: block; font-weight: 500; font-size: 28px; color: #5d6a77; margin-top: 10px; }
  .cite { font: 600 30px/1.3 "IBM Plex Mono", monospace; background: #15202e; color: #f5d352; padding: 18px 24px; border-radius: 10px; white-space: nowrap; }
  .ticks { position: absolute; left: 72px; right: 72px; top: 28px; display: flex; gap: 5px; }
  .ticks i { flex: 1; height: 10px; background: #c8d0d7; border-radius: 2px; }
  .ticks i.d { background: #15202e; } .ticks i.n { background: #f5d352; box-shadow: inset 0 0 0 2px #15202e; height: 16px; margin-top: -3px; }
</style>
<div class="ticks" id="t"></div>
<div class="wrap" id="a">
  <div class="eyebrow">Obsidian 플러그인 · 무료</div>
  <h1>AI가 인용한 논문,<br><mark>진짜</mark> 있나요?</h1>
  <div class="foot">
    <div class="claim">내 서재를 evidence database로<small>내 논문만 근거로 답하는 AI</small></div>
    <div class="cite">[1] 내 서재 → 원문</div>
  </div>
</div>
<div class="wrap" id="b" hidden>
  <div class="eyebrow">Academic Paper Citation Manager</div>
  <h1><span class="strike">그럴듯한 가짜 인용</span><br>내 논문이 <mark>근거</mark></h1>
  <div class="foot">
    <div class="claim">출처가 붙는 AI 논문 서재<small>Obsidian 플러그인 · 무료 · MIT</small></div>
    <div class="cite">1,605편 → 33개 질문</div>
  </div>
</div>
<script>
  const t = document.getElementById("t");
  for (let i = 0; i < 40; i++) { const e = document.createElement("i"); e.className = i < 26 ? "d" : i === 26 ? "n" : ""; t.appendChild(e); }
  if (location.search.includes("v=b")) { document.getElementById("a").hidden = true; document.getElementById("b").hidden = false; }
</script>
<style>[hidden]{display:none!important}</style>
