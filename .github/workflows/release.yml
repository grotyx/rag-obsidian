# Build the release assets from the tagged commit, attest their provenance, and publish the
# GitHub release. Push an exact `X.Y.Z` tag (no `v`) that matches manifest.json to run it.
#
# Two jobs: `build` runs npm ci / lint / build / tests with a read-only token, so a compromised
# dependency can't publish or sign anything; `publish` holds the write, OIDC and attestation
# permissions and only attests and uploads the artifact `build` produced.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Tag must match manifest.json and package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            echo "tag $tag, manifest $manifest, package $pkg — they must match" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:mcp

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            main.js
            manifest.json
            styles.css
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" --notes-file notes.md
